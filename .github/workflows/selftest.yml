name: selftest

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tool selftests
        run: |
          set -e
          for f in tools/*.py; do
            echo "== $f"
            python "$f" selftest
          done
      - name: Conformance suite
        run: python conformance/conformance_suite.py
      - name: Adapter smoke test
        run: |
          python adapters/mem0_to_amtf.py examples/sample_mem0_export.json > /dev/null
          python adapters/zep_to_amtf.py examples/sample_zep_export.json > /dev/null
